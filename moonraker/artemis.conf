[webcam c110Artemis]
enabled: True
service: mjpegstreamer-adaptive
target_fps: 15
target_fps_idle: 5
stream_url: https://c110artemis.matthewshannon.art/mjpeg
snapshot_url: https://c110artemis.matthewshannon.art/image.jpg

[wled chamber]
type: http
address: wled-artemis
chain_count: 26

[update_manager happy-hare]
type: git_repo
path: ~/Happy-Hare
origin: https://github.com/moggieuk/Happy-Hare.git
primary_branch: main
install_script: install.sh
managed_services: klipper

[mmu_server]
enable_file_preprocessor: True
enable_toolchange_next_pos: True
update_spoolman_location: True
