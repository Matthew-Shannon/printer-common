[gcode_macro MERLIN]
gcode: M118 <*> Calling MERLIN
variable_nozzle_wipe_x_pos: 236
variable_nozzle_purge_x_pos: 257.5 # 260 
variable_nozzle_purge_amount: 32.0 # 20.0
variable_nozzle_retract_dist: 14.0 #2.0
variable_nozzle_snap_dist: 2.0 #14.0
variable_lane_angles: { -1: -1, 0: 106, 1: 145, 2: 33, 3: 69 }
variable_warm_temps: { "PLA": 70.0, "PETG": 80.0, "TPU": 60.0 }
variable_filament_offsets: { "PLA": 0.0, "PETG": 0.0, "TPU": 0.0 }
variable_plate_offsets: { "Textured PEI Plate": 0.0, "Smooth High Temp Plate": 0.0 }
variable_wled_presets: { "Idle": 1, "Heating": 2, "Printing": 3, "Pause": 4, "Cancel": 5, "Resume": 6, "Homing": 7, "Complete": 8 }
description: Macro to store data

# -------------------------------------------------------------------------------------------
# START_PRINT
# -------------------------------------------------------------------------------------------
[gcode_macro START_PRINT]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set m = printer["gcode_macro MERLIN"] %}
    M118 <*> Calling START_PRINT:

    # temp
    {% set bed_temp = params.BED_TEMP|default(0)|float %}
    {% set e_temp = params.EXTRUDER_TEMP|default(0)|float %}
    M118 <|> bed_temp={ "%.1f" % bed_temp }, e_temp={ "%.1f" % e_temp }

    # filament
    {% set filament_type = params.FILAMENT_TYPE|default('')|string %}
    {% set filament_offset = m.filament_offsets.get(filament_type, 0.0)|float %}
    M118 <|> filament: type={ "%s" % filament_type }, offset={ "%+.3f" % filament_offset }

    # plate
    {% set plate_type = params.BED_TYPE|default('')|string %}
    {% set plate_offset = m.plate_offsets.get(plate_type, 0.0)|float %}
    M118 <|> plate: type={ "%s" % plate_type }, offset={ "%+.3f" % plate_offset }

    # z_offset
    {% set tap_adjust = c.tap_adjust_z|float %}
    {% set final_offset = (tap_adjust + filament_offset + plate_offset)|float %}
    M118 <|> final_offset={ "%+.3f" % final_offset }

    {% set warm_temp = e_temp - m.warm_temps.get(filament_type, 0.0)|float %}
    M118 <|> warm_temp={ "%.1f" % warm_temp }

    PROBE_EDDY_NG_SET_TAP_ADJUST_Z VALUE={final_offset}
    EXCLUDE_OBJECT_DEFINE
    M104 S{warm_temp}
    AUTO_GANTRY_LEVEL BED_TEMP={bed_temp}
    NOZZLE_WIPE
    TOOLHEAD_CENTER PROBE_XY_OFFSETS=0
    PROBE_EDDY_NG_TAP
    BED_MESH_CALIBRATE
    AUTO_POOP E_TEMP={e_temp}
    NOZZLE_PRIME E_TEMP={e_temp}
    WLED_ON STRIP=chamber PRESET=Printing
description: Start print sequence with dual-stage wiping and purging

# -------------------------------------------------------------------------------------------
# RESUME
# -------------------------------------------------------------------------------------------

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set m = printer["gcode_macro MERLIN"] %}
    {% set e_temp = printer['gcode_macro RESUME'].etemp|float %}
    #{% set vars = printer['gcode_macro _MMU_CLIENT_VARS'] %}
    M118 <*> Calling RESUME
    WLED_ON STRIP=chamber PRESET=Resume
    {% if e_temp > 0 %} M109 S{e_temp} {% endif %}
    AUTO_POOP E_TEMP={e_temp}
    NOZZLE_PRIME E_TEMP={e_temp}
    RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=100
    WLED_ON STRIP=chamber PRESET=Printing
    #{vars.user_resume_extension|default("")}
    #{% if not printer.mmu.enabled %}
    #   _MMU_RESTORE_POSITION	# This will take the correct "over and down" movement path and unretract
    #{% endif %}
    BASE_RESUME
description: Resume a print, restoring precise position and Z height

# -------------------------------------------------------------------------------------------
# PAUSE
# -------------------------------------------------------------------------------------------
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set e_temp = printer['extruder'].target|float %}
    #{% set vars = printer['gcode_macro _MMU_CLIENT_VARS'] %}
    M118 <*> Calling PAUSE
    WLED_ON STRIP=chamber PRESET=Pause
    SAVE_GCODE_STATE NAME=PAUSE
    #_MMU_SAVE_POSITION
    BASE_PAUSE
    #{% if not printer.mmu.enabled %}
    #    _MMU_PARK OPERATION="pause"
    #{% endif %}
    #{vars.user_pause_extension|default("")}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={c.z_hop_dist|float}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={e_temp}
    NOZZLE_RETRACT
    M104 S0
    NOZZLE_WIPE
    TOOLHEAD_PARK
description: Pause print safely with anti-blob snap and precise Z preservation

# -------------------------------------------------------------------------------------------
# CANCEL_PRINT
# -------------------------------------------------------------------------------------------
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    M118 <*> Calling CANCEL_PRINT
    CLEAR_PAUSE
    NOZZLE_RETRACT
    M104 S0 # turn of extruder
    M140 S0 # turn of bed
    M107 ; turn off fan
    NOZZLE_WIPE
    TOOLHEAD_REAR
    CLEAR_FILE
    BED_MESH_CLEAR
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    BASE_CANCEL_PRINT
    WLED_ON STRIP=chamber PRESET=Cancel
description: Cancel a print, turn off heaters, and park the toolhead

# -------------------------------------------------------------------------------------------
# END_PRINT
# -------------------------------------------------------------------------------------------
[gcode_macro END_PRINT]
gcode:
    M118 <*> Calling END_PRINT
    WLED_ON STRIP=chamber PRESET=Complete
    NOZZLE_RETRACT
    M104 S0 # turn of extruder
    M140 S0 # turn of bed
    M107 ; turn off fan
    NOZZLE_WIPE
    TOOLHEAD_REAR
    # {% if not printer.mmu.enabled %}
    #     _MMU_PARK OPERATION="cancel"
    # {% else %}
    #     {% if unload_tool_on_cancel %}
    #         M118 Ejecting filament on print cancel
    #         MMU_UNLOAD RESTORE=0
    #     {% endif %}
    #     {% if reset_ttg_on_cancel %}
    #         MMU_TTG_MAP RESET=1 QUIET=1
    #     {% endif %}
    # {% endif %}
    # _MMU_CLEAR_POSITION
    CLEAR_FILE
    BED_MESH_CLEAR
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    M84 ; turn off motors
    #{vars.user_cancel_extension|default("")}
description: End a print with immediate anti-blob separation, turn off heaters, and park

# -------------------------------------------------------------------------------------------
# CLEAR_FILE
# -------------------------------------------------------------------------------------------
[delayed_gcode CLEAR_FILE]
gcode:
    M118 <*> Calling CLEAR_FILE
    SDCARD_RESET_FILE
description: Clear SD file after print

# -------------------------------------------------------------------------------------------
# TOOLHEAD
# -------------------------------------------------------------------------------------------
[gcode_macro TOOLHEAD_PARK]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set x_pos = c.bed_mid|float %}
    {% set y_pos = printer.toolhead.axis_minimum.y|float + 2 %}
    M118 <*> Calling TOOLHEAD_PARK x={ "%.1f" % x_pos }, y={ "%.1f" % y_pos }
    SAVE_GCODE_STATE NAME=TOOLHEAD_PARK
    G91 ; relative
    G0 Z{c.z_hop_dist|float*3} F300
    G90 ; absolute
    G0 X{x_pos} Y{y_pos} F6000
    RESTORE_GCODE_STATE NAME=TOOLHEAD_PARK #MOVE=0
description: Park the toolhead at front-center and lift Z safely, used for pause and resume

[gcode_macro TOOLHEAD_REAR]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set x_pos = printer.toolhead.axis_minimum.x|float + 10 %}
    {% set y_pos = printer.toolhead.axis_maximum.y|float - 10 %}
    M118 <*> Calling TOOLHEAD_REAR x={ "%.1f" % x_pos }, y={ "%.1f" % y_pos }
    SAVE_GCODE_STATE NAME=TOOLHEAD_REAR
    G91 ; relative
    G0 Z{c.z_hop_dist|float*3} F300
    G90 ; absolute
    G0 X{x_pos} Y{y_pos} F6000
    RESTORE_GCODE_STATE NAME=TOOLHEAD_REAR #MOVE=0
description: Park the toolhead back-center and lift Z safely, used for end print

[gcode_macro TOOLHEAD_CENTER]
gcode: 
    {% set c = printer.configfile.settings.constants %}
    {% set apply_offset = params.PROBE_XY_OFFSETS|default(1)|int == 1 %}
    {% set x_pos = c.bed_mid|float - (c.x_probe_offset|float if apply_offset else 0) %}
    {% set y_pos = c.bed_mid|float - (c.y_probe_offset|float if apply_offset else 0) %}
    M118 <*> Calling TOOLHEAD_CENTER x={ "%.1f" % x_pos}, y={ "%.1f" % y_pos }
    SAVE_GCODE_STATE NAME=TOOLHEAD_CENTER
    G91 ; relative
    G0 Z{c.z_hop_dist|float*3} F300
    G90 ; absolute
    G0 X{x_pos} Y{y_pos} F6000
    RESTORE_GCODE_STATE NAME=TOOLHEAD_CENTER
description: Move toolhead to center, used to center the toolhead with optional probe offsets applied

# -------------------------------------------------------------------------------------------
# NOZZLE
# -------------------------------------------------------------------------------------------
[gcode_macro NOZZLE_RETRACT]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set m = printer["gcode_macro MERLIN"] %}
    {% set retract_dist = m.nozzle_retract_dist|float %}
    {% set snap_dist = m.nozzle_snap_dist|float %}
    M118 <*> Calling NOZZLE_RETRACT (Anti-Blob & Dip-and-Snap)
    SAVE_GCODE_STATE NAME=NOZZLE_RETRACT

    G91 ; relative
    G0 Z0.5 F300
    G0 X2 F6000

    M83 ; relative extrusion

    # 1. Fast initial pull out of melt chamber (Now 14mm at 120mm/s)
    G1 E-{retract_dist} F7200
    
    # 2. Micro Dip-and-Snap in transition zone
    G1 E0.8 F3000
    G1 E-1.8 F7200

    # 3. Quick cooling shuttle moves in heatbreak    
    G1 E1.0 F2000
    G1 E-8.0 F2000
    G1 E6.0 F2000
    G1 E-6.0 F2000

    # 4. Final pull to park position (Now 2mm at 100mm/s)
    G1 E-{snap_dist} F6000
    RESTORE_GCODE_STATE NAME=NOZZLE_RETRACT
description: Combined anti-blob pressure relief and dip-and-snap tip shaping

[gcode_macro NOZZLE_PRIME]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set m = printer["gcode_macro MERLIN"] %}
    {% set e_temp = params.E_TEMP|default(0)|float %}
    {% set retract_dist = m.nozzle_retract_dist|float %}
    M118 <*> Calling NOZZLE_PRIME
    M109 S{e_temp}
    SAVE_GCODE_STATE NAME=NOZZLE_PRIME
    M83 ; force relative extrusion
    G1 E{m.nozzle_retract_dist|float*2} F300 ; prime 2mm back into cavity
    RESTORE_GCODE_STATE NAME=NOZZLE_PRIME
description: Prime nozzle after pause or retract, restoring molten thread to tip


[gcode_macro NOZZLE_PURGE]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set m = printer["gcode_macro MERLIN"] %}
    {% set e_temp = params.E_TEMP|default(0)|float %}
    {% set x_pos = m.nozzle_purge_x_pos|float %}
    {% set purge_amount = m.nozzle_purge_amount|float %}
    {% set retract_dist = m.nozzle_retract_dist|float %}
    M118 <*> Calling NOZZLE_PURGE
    M109 S{e_temp}
    SAVE_GCODE_STATE NAME=NOZZLE_PURGE
    G90 ; absolute
    G0 X{x_pos} F6000
    M83 ; relative
    G92 E0 ; reset extruder position
    G1 E{purge_amount} F300 # + 30mm
    G1 E-{retract_dist} F900 # - 2mm
    G4 S4 ; thermal delay to freeze the purge blob
    RESTORE_GCODE_STATE NAME=NOZZLE_PURGE
description: Purge sequence tuned for Dip-and-Snap void refill

[gcode_macro NOZZLE_WIPE]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set m = printer["gcode_macro MERLIN"]%}
    {% set x_pos = m.nozzle_wipe_x_pos|float %}
    M118 <*> Calling NOZZLE_WIPE x={ "%.1f" % x_pos }
    SAVE_GCODE_STATE NAME=NOZZLE_WIPE
    G90 ; absolute
    G0 X{x_pos} F6000
    {% for i in range(5) %} 
        G0 X{x_pos + 6}F2000
        G0 X{x_pos} F2000
    {% endfor %}
    RESTORE_GCODE_STATE NAME=NOZZLE_WIPE
description: Stateless nozzle wipe over brush

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# AUTO FUNCTIONS
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[gcode_macro G28]
rename_existing: G28.1
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set home_all = not ('X' in params) and not ('Y' in params) and not ('Z' in params) %}
    M118 <*> Calling G28
    WLED_ON STRIP=chamber PRESET=Homing
    
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0
        G90 ; absolute
        G0 Z{c.z_hop_dist|float*3} F300
    {% endif %}
    
    {% if home_all or 'X' in params %}
        M118 <|> Homing X
        G28.1 X
    {% endif %}
    
    {% if home_all or 'Y' in params %}
        M118 <|> Homing Y
        G28.1 Y
    {% endif %}

    {% if home_all or 'Z' in params %}
        M118 <|> Homing Z
        TOOLHEAD_CENTER PROBE_XY_OFFSETS=1

        G28.1 Z

        G90 ; absolute
        G0 Z{c.z_hop_dist|float} F300

        PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
        
        G90 ; absolute
        G0 Z{c.z_hop_dist|float*3} F300
 
    {% endif %}

    WLED_ON STRIP=chamber PRESET=Idle
description: Home X, Y, Z axes safely

[gcode_macro AUTO_GANTRY_LEVEL]
gcode:
    {% set bed_temp = params.BED_TEMP|default(65.0)|float %}
    M118 <*> Calling AUTO_GANTRY_LEVEL
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    M190 S{bed_temp}
    Z_TILT_ADJUST
    G28 Z
description: Home and adjust Z-tilt

[gcode_macro AUTO_SCREW_TILT_CALIBRATE]
gcode:
    {% set bed_temp = params.BED_TEMP|default(65.0)|float %}
    M118 <*> Calling AUTO_SCREW_TILT_CALIBRATE bed={ "%.1f" % bed_temp }
    M84
    AUTO_GANTRY_LEVEL BED_TEMP={bed_temp}
    SCREWS_TILT_CALCULATE
description: Auto calibrate bed mesh and screws tilt

[gcode_macro AUTO_EDDY_CALIBRATE]
gcode: 
    {% set c = printer.configfile.settings.constants %}
    {% set bed_temp = params.BED_TEMP|default(65.0)|float %}
    M118 <*> Calling AUTO_EDDY_CALIBRATE
    {% for i in range(5) %}
        PROBE_EDDY_NG_STATUS
    {% endfor %}
    M190 S{bed_temp}
    G28 X Y
    TOOLHEAD_CENTER PROBE_XY_OFFSETS=0
    PROBE_EDDY_NG_SETUP
description: Calibrate EDDY probe and setup for bed mesh

[gcode_macro AUTO_Z_TILT_NG_CALIBRATE]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set bed_temp = params.BED_TEMP|default(65.0)|float %}
    M118 <*> Calling AUTO_Z_TILT_NG_CALIBRATE bed={ "%.1f" % bed_temp }
    AUTO_GANTRY_LEVEL BED_TEMP={bed_temp}
    Z_TILT_CALIBRATE
description: Calibrate Z-tilt using Eddy probe

[gcode_macro AUTO_TAP_CHECK]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set bed_temp = params.BED_TEMP|default(65.0)|float %}
    {% set tap_adjust = params.TAP_ADJUST|default(c.tap_adjust_z|float)|float %}
    M118 <*> Calling AUTO_TAP_CHECK tap={ "%.3f" % tap_adjust}, bed={ "%.1f" % bed_temp }
    M190 S{bed_temp}
    PROBE_EDDY_NG_SET_TAP_ADJUST_Z VALUE={tap_adjust}
    PROBE_EDDY_NG_TAP
    TOOLHEAD_CENTER PROBE_XY_OFFSETS=0
description: Check Tap accuracy

[gcode_macro AUTO_POOP]
gcode:
    {% set e_temp = params.E_TEMP|default(0)|float %}
    M118 <*> Calling AUTO_POOP
    NOZZLE_PURGE E_TEMP={e_temp}
    NOZZLE_WIPE
description: Purge and wipe nozzle to prevent blobs

# -------------------------------------------------------------------------------------------
# HEATING
# -------------------------------------------------------------------------------------------
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set temp = params.S|default(0)|float %}
    M118 <*> Calling M109 extruder={ "%.1f" % temp }
    WLED_ON STRIP=chamber PRESET=Heating
    {% if 'S' in params %} M99109 S{temp} {% endif %}
    WLED_ON STRIP=chamber PRESET=Idle
description: Heat extruder and wait

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set temp = params.S|default(0)|float %}
    M118 <*> Calling M190 bed={ "%.1f" % temp }
    WLED_ON STRIP=chamber PRESET=Heating
    {% if temp != 0 %} M99190 S{temp} {% endif %}
    WLED_ON STRIP=chamber PRESET=Idle
description: Heat bed and wait

[gcode_macro UTIL_PID_BED]
gcode: 
    {% set req = params.TEMP|float %}
    M118 <*> Calling UTIL_PID_BED bed={ "%.1f" % req }
    PID_CALIBRATE HEATER=heater_bed TARGET={req}
description: Calibrate bed PID

[gcode_macro UTIL_PID_EXTRUDER]
gcode: 
    {% set req = params.TEMP|float %}
    M118 <*> Calling UTIL_PID_EXTRUDER extruder={ "%.1f" % req }
    PID_CALIBRATE HEATER=extruder TARGET={req}
description: Calibrate extruder PID

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# WLED (ENCLOSURE STRIP)
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[delayed_gcode INIT_WLED]
initial_duration: 10
gcode: WLED_ON STRIP=chamber PRESET=Idle
description: Initialize lighting

[gcode_macro WLED_ON]
gcode:
  {% set m = printer["gcode_macro MERLIN"] %}
  {% set strip = params.STRIP|string %}
  {% set preset = params.PRESET|default("")|string %}
  {% set preset_index = m.wled_presets.get(preset, 0)|int %}
  {action_call_remote_method("set_wled_state",strip=strip,state=True,preset=preset_index)}
description: Turn WLED strip on using optional preset

[gcode_macro WLED_OFF]
gcode:
  {% set strip = params.STRIP|string %}
  M118 <*> Calling WLED_OFF strip={ "%s" % strip }
  {action_call_remote_method("set_wled_state",strip=strip,state=False)}
description: Turn WLED strip off

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# OVERRIDE SLICER LIMITS CONTROLS
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[gcode_macro M201]
gcode: M118 <*> Skipping M201
description: Dummy macro for Marlin acceleration limits compatibility

[gcode_macro M203]
gcode: M118 <*> Skipping M203
description: Dummy macro for Marlin maximum feedrate compatibility

[gcode_macro M205]
gcode: M118 <*> Skipping M205
description: Dummy macro for Marlin jerk compatibility
