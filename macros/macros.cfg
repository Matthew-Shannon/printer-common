# -------------------------------------------------------------------------------------------
# START_PRINT
# -------------------------------------------------------------------------------------------
[gcode_macro START_PRINT]
gcode:
    {% set bed_temp = params.BED_TEMP|default(0)|float %}
    {% set e_temp = params.EXTRUDER_TEMP|default(0)|float %}
    {% set filament_type = params.FILAMENT_TYPE|default('')|string|upper %}
    {% set z_tap_adjust = printer['probe'].tap_adjust_z|float %}
    {% set filament_offset = {"PLA": 0.0,"PETG": -0.020,"TPU": 0.0}.get(filament_type, 0.0)|float %}
    #{% set buildplate_offset = {}: float}

    EXCLUDE_OBJECT_DEFINE
    SET_FILAMENT_SENSOR_ON
    {action_respond_info("<*> Calling START_PRINT: Bed=%.1f, Extruder=%.1f, Z_TAP=%.3f, Offset=%+.3f, Filament=%s" % (bed_temp, e_temp, z_tap_adjust, filament_offset, filament_type))}
    
    G90 ; Absolute positioning
    PROBE_EDDY_NG_SET_TAP_ADJUST_Z VALUE={(z_tap_adjust + filament_offset)|float}

    M104 S{e_temp-50}
    M190 S{bed_temp}

    AUTO_Z_TILT
    NOZZLE_WIPE

    AUTO_CENTER_TOOLHEAD
    PROBE_EDDY_NG_TAP
    BED_MESH_CALIBRATE

    M109 S{e_temp}
    AUTO_PURGE
    WLED_ON STRIP=chamber PRESET=PRINTING

description: Start print sequence with dual-stage wiping and purging

# -------------------------------------------------------------------------------------------
# END_PRINT
# -------------------------------------------------------------------------------------------
[gcode_macro END_PRINT]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set x_pos = printer.toolhead.axis_minimum.x|float %}     
    {% set y_pos = (printer.toolhead.axis_maximum.y - 15.0)|float %}
    {% set xy_speed = (c.travel_speed|float) * 60.0|float %}
    {action_respond_info("<*> Calling END_PRINT moving to %d,%d" % (x_pos,y_pos))}

    AUTO_RETRACT_TIP
    AUTO_LIFT_Z HOP=50
    G90
    G1 X{x_pos} Y{y_pos} F{xy_speed} ; Park

    TURN_OFF_HEATERS
    M84 ; disable motors
    M107 ; turn off fan
    SET_FILAMENT_SENSOR_OFF
    WLED_ON STRIP=chamber PRESET=COMPLETE
    
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    BED_MESH_CLEAR
    UPDATE_DELAYED_GCODE ID=CLEAR_FILE DURATION=1
description: End a print, turn off heaters, and park the toolhead

# -------------------------------------------------------------------------------------------
# CANCEL_PRINT
# -------------------------------------------------------------------------------------------
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {action_respond_info("<*> Calling CANCEL_PRINT")}
    CLEAR_PAUSE
    END_PRINT
    BASE_CANCEL_PRINT
    WLED_ON STRIP=chamber PRESET=CANCEL
description: Cancel a print, turn off heaters, and park the toolhead

# -------------------------------------------------------------------------------------------
# PAUSE
# -------------------------------------------------------------------------------------------
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set x_pos = (printer.toolhead.axis_maximum.x / 2.0)|float %}                                        
    {% set y_pos = (printer.toolhead.axis_minimum.y + 5.0)|float %}     
    {% set xy_speed = (c.travel_speed|float) * 60.0|float %}       
    {% set e_temp = printer['extruder'].target|float %}    
    {action_respond_info("<*> Calling PAUSE")}

    {% if printer['pause_resume'].is_paused %}
        {action_respond_info("Printer is already paused.")}
        {exit()}  # Optional: halts macro execution cleanly in Klipper
    {% endif %}

    WLED_ON STRIP=chamber PRESET=PAUSE

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={c.z_hop_dist}    ; set z hop variable for reference in resume macro
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={e_temp}         ; set hotend temp variable for reference in resume macro                           

    SET_FILAMENT_SENSOR_OFF
    
    SAVE_GCODE_STATE NAME=PAUSE                                           ; save current print position for resume
    BASE_PAUSE      

    AUTO_RETRACT_TIP
    AUTO_LIFT_Z
    G90
    G1 X{x_pos} Y{y_pos} F{xy_speed}                                      ; park toolhead at front center
    SAVE_GCODE_STATE NAME=PAUSEPARK                                       ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
    M104 S0                                                               ; turn off hotend
description: Pause a print, optionally raising Z and parking the toolhead

# -------------------------------------------------------------------------------------------
# RESUME
# -------------------------------------------------------------------------------------------
[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set e = params.E|default(2.5)|float %}
    {% set zhop = printer['gcode_macro RESUME'].zhop|float %}
    {% set z_speed = (c.z_max_speed|float) * 60.0|float %}
    {% set etemp = printer['gcode_macro RESUME'].etemp|float %}
    {action_respond_info("<*> Calling RESUME prime_amount=%.1f " % (e))}

    {% if not printer['pause_resume'].is_paused %}
        {action_respond_info("<*> Print is not paused. No action taken.")}
        {exit()}  # Optional: halts macro execution cleanly in Klipper
    {% endif %}

    {% if zhop == 0 %}{action_respond_info("<*> Z hop is 0. No action taken.")}{% endif %}
    {% if zhop > 0 %}{action_respond_info("<*> Resuming print with Z hop of %.1f" % (zhop))}{% endif %}
    {% if etemp > 0 %}{action_respond_info("<*> Resuming print with hotend temp of %.1f" % (etemp))}{% endif %}
    WLED_ON STRIP=chamber PRESET=RESUME
    SET_FILAMENT_SENSOR_ON

    {% if etemp > 0 %} M109 S{etemp} {% endif %}                                  ; wait for hotend to heat back up
    RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED={c.travel_speed|float}   ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
    G91                                                                           ; relative positioning
    M83                                                                           ; relative extruder positioning
    G1 Z{zhop * -1} F{z_speed}                                                    ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
    AUTO_PURGE
    RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED={c.travel_speed|float}       ; restore position
    WLED_ON STRIP=chamber PRESET=PRINTING
    BASE_RESUME

description: Resume a print after a pause, optionally restoring position & temperatures

# -------------------------------------------------------------------------------------------
# M109
# -------------------------------------------------------------------------------------------
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    {action_respond_info("<*> Calling M109 Heating Extruder to: %.1f" % (s))}
    WLED_ON STRIP=chamber PRESET=HEATING
    M104 {% for p in params %}{p}{params[p]} {% endfor %}  ; Set hotend temp using safe token evaluation
    {% if s != 0 %} TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} {% endif %} ; Wait for hotend temp
    WLED_ON STRIP=chamber PRESET=IDLE
description: Heat the extruder to a specified temperature and wait until it reaches that temperature

# -------------------------------------------------------------------------------------------
# M190
# -------------------------------------------------------------------------------------------
[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|default(0)|float %}
    {action_respond_info("<*> Calling M190 Heating Bed to: %.1f" % (s))}
    WLED_ON STRIP=chamber PRESET=HEATING
    M140 {% for p in params %}{p}{params[p]} {% endfor %}   ; Set bed temp using safe token evaluation
    {% if s != 0 %} TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} {% endif %} ; Wait for bed temp (within 2 degree)
    WLED_ON STRIP=chamber PRESET=IDLE
description: Heat the bed to a specified temperature and wait until it reaches that temperature

# -------------------------------------------------------------------------------------------
# CLEAR_FILE
# -------------------------------------------------------------------------------------------
[delayed_gcode CLEAR_FILE]
gcode: SDCARD_RESET_FILE
description: clear sd file after print

# -------------------------------------------------------------------------------------------
# FILAMENT
# -------------------------------------------------------------------------------------------
[delayed_gcode DISABLE_FILAMENT_SENSOR_ON_STARTUP]
initial_duration: 1
gcode: SET_FILAMENT_SENSOR_OFF
description: Disable filament sensor on startup

[gcode_macro SET_FILAMENT_SENSOR_OFF]
gcode: SET_FILAMENT_SENSOR SENSOR=sp_sensor_runout ENABLE=0
description: Disable filament sensor

[gcode_macro SET_FILAMENT_SENSOR_ON]
gcode: SET_FILAMENT_SENSOR SENSOR=sp_sensor_runout ENABLE=1
description: Enable filament sensor

[gcode_macro M600]
gcode: PAUSE
description: Filament change

# -------------------------------------------------------------------------------------------
# MMU
# -------------------------------------------------------------------------------------------

[gcode_macro _SP_PRINT_START]
gcode: {action_respond_info("<*> Calling _SP_PRINT_START noop")}
description: default no-op override

[gcode_macro _SP_PRINT_END]
gcode: {action_respond_info("<*> Calling _SP_PRINT_END noop")}
description: default no-op override

[gcode_macro _SP_SET_PURGE]
gcode: {action_respond_info("<*> Calling _SP_SET_PURGE noop")}
description: default no-op override

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# WLED (ENCLOSURE STRIP)
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~================~~~~~~~

[delayed_gcode INIT_WLED]
initial_duration: 10
gcode: WLED_ON STRIP=chamber PRESET=Idle
description: initalize the lights

[gcode_macro WLED_ON]
gcode:
  {% set strip = params.STRIP|string %}
  {% set preset = params.PRESET|default("NA")|string|upper %}
  {% set preset_index = {"IDLE":1,"HEATING":2,"PRINTING":3,"PAUSE":4,"CANCEL":5,"RESUME":6,"HOMING":7,"COMPLETE":8}.get(preset, 0)|int %}
  # {action_respond_info("<*> Calling WLED_ON STRIP=%s PRESET=%s" % (strip,preset))}
  {action_call_remote_method("set_wled_state",strip=strip,state=True,preset=preset_index)}
description: Turn WLED strip on using optional preset and resets led colors

[gcode_macro WLED_OFF]
gcode:
  {% set strip = params.STRIP|string %}
  {action_respond_info("<*> Calling WLED_OFF STRIP=%s" % (strip))}
  {action_call_remote_method("set_wled_state",strip=strip,state=False)}
description: Turn WLED strip off

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# AUTO FUNCTIONS
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

[gcode_macro AUTO_HOME]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set x_pos = (c.bed_mid|float) - (c.x_probe_offset|float) %}
    {% set y_pos = (c.bed_mid|float) - (c.y_probe_offset|float) %}
    {% set xy_speed = (c.travel_speed|float) * 60.0|float %}
    {% set z_speed = (c.z_max_speed|float) * 60.0|float %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {action_respond_info("<*> Calling AUTO_HOME with X=%.1f, Y=%.1f" % (x_pos, y_pos))}
    WLED_ON STRIP=chamber PRESET=HOMING
    
    ; If Z axis is not homed, set virtual position and raise
    {% if 'z' not in printer.toolhead.homed_axes %}
        {action_respond_info("<*>   Raising Z")}
        SET_KINEMATIC_POSITION Z=0
        G90
        G0 Z5 F{z_speed}
    {% endif %}

    {% if home_all or 'X' in params %} 
        {action_respond_info("<*>   Homing X")}
        G28 X 
    {% endif %}

    {% if home_all or 'Y' in params %}
        {action_respond_info("<*>   Homing Y")}
        G28 Y 
    {% endif %}

    {% if home_all or 'Z' in params %}
        {action_respond_info("<*>   Homing Z")}
        G0 X{x_pos} Y{y_pos} F{xy_speed}
        G28 Z
        G0 Z{c.z_hop_dist} F{z_speed}
        G4 S1
        M400
        PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
        G0 Z10 F{z_speed}
    {% endif %}

    WLED_ON STRIP=chamber PRESET=IDLE
description: Conditionally home X & Y and also home Z

[gcode_macro AUTO_LIFT_Z]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set z_hop_dist = params.HOP|default(c.z_hop_dist)|float %} 
    {% set z_max = printer.toolhead.axis_maximum.z %}
    {% set z_speed = (c.z_max_speed|float) * 60.0|float %}
    {% set req = printer.gcode_move.position.z + z_hop_dist %} ; calculate requested Z height after hop
    {action_respond_info("<*> Calling AUTO_LIFT_Z with z_hop_dist=%.1f, req_after_hop=%.1f" % (z_hop_dist, req))}

    G91 ; relative                                                               
    {% if req >= z_max %} ; if z max is exceeded, show message and set zhop value for resume to 0
        { action_respond_info("Pause zhop exceeds maximum Z height.") }                  
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
    {% else %}
        G1 Z{z_hop_dist} F{z_speed}  ; raise Z up by z hop amount using Kalico constants                  
    {% endif %}
    G90 ; absolute                                                            
description: Raise Z by a specified amount, ensuring it does not exceed the maximum Z height

[gcode_macro AUTO_CALIBRATE]
gcode:
    {% set bed_temp = params.BED_TEMP|default(60.0)|float %}
    {action_respond_info("<*> Calling AUTO_CALIBRATE with bed_temp=%.1f" % (bed_temp))}
    M84
    M190 S{bed_temp}
    AUTO_Z_TILT
    #AUTO_X_TWIST
    #AUTO_Y_TWIST
    SCREWS_TILT_CALCULATE
description: Auto calibrate the bed mesh and screws tilt

[gcode_macro AUTO_Z_TILT]
gcode:
    {action_respond_info("<*> Calling AUTO_Z_TILT")}
    G28
    Z_TILT_ADJUST
    G28 Z
description: Home and adjust Z-tilt

[gcode_macro AUTO_TAP_CHECK]
gcode:
    {% set bed_temp = params.BED_TEMP|default(65)|float %}
    {% set tap_adjust = params.TAP_ADJUST|default(printer['probe'].tap_adjust_z)|float %}
    M190 S{bed_temp}
    AUTO_Z_TILT
    AUTO_CENTER_TOOLHEAD
    PROBE_EDDY_NG_SET_TAP_ADJUST_Z VALUE={tap_adjust}
    PROBE_EDDY_NG_TAP
    #M400 # wait for tap
    #AUTO_CENTER_TOOLHEAD
    #AUTO_LIFT_Z HOP=6

[gcode_macro AUTO_EDDY_CALIBRATE]
gcode: 
    {% set c = printer.configfile.settings.constants %}
    {% set xy_speed = (c.travel_speed|float) * 60.0|float %}
    {action_respond_info("<*> Calling AUTO_EDDY_CALIBRATE")}

    G28 X Y
    G1 X{c.bed_mid} Y{c.bed_mid} F{xy_speed}

    {% for i in range(5) %} 
    PROBE_EDDY_NG_STATUS
    {% endfor %}

    M190 S60 ; heat bed to 60C for calibration

    PROBE_EDDY_NG_SETUP
description: Calibrate the EDDY probe and setup for bed mesh calibration

[gcode_macro AUTO_PID_EXTRUDER]
gcode: 
    {% set req = params.TEMP|float %}
    {action_respond_info("<*> Calling AUTO_PID_EXTRUDER Extruder PID for: %.1f" % (req))}
    PID_CALIBRATE HEATER=extruder TARGET={req}
description: Calibrate the PID for the extruder heater to a specified temperature

[gcode_macro AUTO_PID_BED]
gcode: 
    {% set req = params.TEMP|float %}
    {action_respond_info("<*> Calling AUTO_PID_BED Bed PID for: %.1f" % (req))}
    PID_CALIBRATE HEATER=heater_bed TARGET={req}
description: Calibrate the PID for the bed heater to a specified temperature

[gcode_macro AUTO_RETRACT_TIP]
gcode:
    {% set retract_dist = -6.0|float %}
    {% set retract_speed = 15.0 * 60.0|float %}
    {action_respond_info("<*> Calling AUTO_RETRACT_TIP | G1 E%.1f F%.1f" % (retract_dist, retract_speed))}

    {% if not printer.extruder.can_extrude %}
        {action_respond_info("<*> Skipping AUTO_RETRACT_TIP Extruder too cold to retract tip safely")}
        {exit()}
    {% endif %}

    G91 ; relative                                                               
    G1 E{retract_dist} F{retract_speed}
    G90 ; absolute       
description: Retract the tip of the extruder by 6mm

[gcode_macro NOZZLE_WIPE]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set xy_speed = (c.travel_speed|float) * 60.0|float %}
    {% set wipe_speed = 80.0 * 60.0|float %}
    {% set half_width = 2.5|float %}
    {% set wipe_center_x = 241.5|float %} # 237.5
    {action_respond_info("<*> Calling NOZZLE_WIPE at X=%.1f" % (wipe_center_x))}

    SAVE_GCODE_STATE NAME=nozzle_wipe_state
    G90
    G1 X{wipe_center_x} F{xy_speed}
    {% for i in range(5) %}
        G1 X{wipe_center_x - half_width} F{wipe_speed}
        G1 X{wipe_center_x + half_width} F{wipe_speed}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=nozzle_wipe_state MOVE=1
    G1 F{xy_speed}
description: Wipe the nozzle by moving it back and forth over a specified area

[gcode_macro AUTO_PURGE]
gcode:
    {% set c = printer.configfile.settings.constants %}
    {% set xy_speed = (c.travel_speed|float) * 60.0|float %}
    {% set purge_amount = 36.0|float %}
    {% set purge_speed = 2.5 * 60.0|float %}
    {% set retract_amount = -0.75|float %}
    {% set retract_speed = 35.0 * 60.0|float %}
    {% set purge_bucket_x = 254.0|float %} # 250.0
    {action_respond_info("<*> Calling AUTO_PURGE at X=%.1f" % (purge_bucket_x))}

    {% if not printer.extruder.can_extrude %}
        {action_respond_info("<*> Extruder too cold to purge safely. Skipped.")}
        {exit()}
    {% endif %}

    SAVE_GCODE_STATE NAME=purge_bucket_state

    G90
    G1 X{purge_bucket_x} F{xy_speed}
    
    SAVE_GCODE_STATE NAME=purge_state               ; Captures the extrusion state mode (M82/M83) before purging
    M83                                             ; Set extruder to relative mode (highly recommended for Klipper)
    G92 E0                                          ; Reset extruder position to 0
    G1 E{purge_amount} F{purge_speed}               ; 150
    G4 S2                                           ; wait for 2 seconds
    G1 E{retract_amount} F{retract_speed}           ; 2100 
    RESTORE_GCODE_STATE NAME=purge_state            ; Reverts extruder mode back safely to whatever the printer or slicer was running
    
    RESTORE_GCODE_STATE NAME=purge_bucket_state
    NOZZLE_WIPE
description: Purge into bucket with thermal delay and wipe

[gcode_macro AUTO_CENTER_TOOLHEAD]
gcode: 
    {% set c = printer.configfile.settings.constants %}
    {% set xy_speed = (c.travel_speed|float) * 60.0|float %}
    {action_respond_info("<*> Calling AUTO_CENTER_TOOLHEAD")}
    G90 ; Force absolute coordinate mapping
    G0 X{c.bed_mid} Y{c.bed_mid} F{xy_speed}
description: move toolhead to center

#Override Slicer Limits Controls
[gcode_macro M205]
gcode: G4 P1

[gcode_macro M203]
gcode: G4 P1

[gcode_macro M201]
gcode: G4 P1